# ===== Chi chiude perde — parole.sensori-iot.duckdns.org =====
# Da AGGIUNGERE in coda a /opt/sensori-iot/nginx/default.conf con `cat >>` (mai sed -i: il file è un bind-mount).
# Le righe marcate COME-CALIBRI vanno copiate identiche dai blocchi di calibri.sensori-iot.duckdns.org
# (listen, percorso della challenge ACME, eventuali include ssl).

# --- PASSO 1: solo porta 80 (serve a certbot per il certificato) ---
server {
    listen 80;                                             # COME-CALIBRI
    server_name parole.sensori-iot.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }   # COME-CALIBRI (stesso root)
    location / { return 301 https://$host$request_uri; }
}

# --- PASSO 2: porta 443, da aggiungere SOLO dopo che il certificato esiste ---
server {
    listen 443 ssl;                                        # COME-CALIBRI (anche http2 se c'è)
    server_name parole.sensori-iot.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/parole.sensori-iot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parole.sensori-iot.duckdns.org/privkey.pem;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/manifest+json image/svg+xml;

    # Risoluzione al momento della richiesta: se parole-relay è giù, nginx parte lo stesso
    # e sensori-iot non ne risente.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $parole_up http://parole-relay:8080;

    location /ws {
        proxy_pass $parole_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / {
        proxy_pass $parole_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
